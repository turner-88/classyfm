{{define "admin-content"}}
<section class="container-page py-12">
  <h1 class="text-3xl font-extrabold tracking-tight">{{if .IsNew}}New User{{else}}Edit User{{end}}</h1>

  {{if .Error}}
  <div class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
  {{end}}

  <form method="post" action="{{if .IsNew}}/admin/users{{else}}/admin/users/{{.User.ID}}{{end}}"
        class="mt-6 max-w-2xl space-y-4 rounded-xl border border-gray-200 bg-white p-6">
    <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">

    <div>
      <label for="name" class="form-label">Name</label>
      <input id="name" name="name" required value="{{.User.Name}}"
             class="mt-1 form-input">
    </div>
    <div>
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email" required value="{{.User.Email}}"
             class="mt-1 form-input">
    </div>
    {{if .IsNew}}
    <div>
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" required
             class="mt-1 form-input">
    </div>
    {{end}}
    <div>
      <label for="role" class="form-label">Role</label>
      <select id="role" name="role"
              class="mt-1 form-select">
        <option value="admin" {{if eq (print .User.Role) "admin"}}selected{{end}}>Admin</option>
        <option value="superadmin" {{if eq (print .User.Role) "superadmin"}}selected{{end}}>Superadmin</option>
      </select>
      <p class="form-help">Superadmins can manage Users and view the Activity Log.</p>
    </div>
    <div class="flex items-center gap-2">
      <input id="is_active" name="is_active" type="checkbox" {{if .User.IsActive}}checked{{end}}
             class="form-check">
      <label for="is_active" class="text-sm font-medium text-gray-700">Active</label>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button type="submit" class="btn-brand">
        <span class="h-4 w-4">{{template "icon-save"}}</span>
        Save
      </button>
      <a href="/admin/users" class="text-sm text-gray-500 hover:underline">Cancel</a>
    </div>
  </form>
</section>
{{end}}
