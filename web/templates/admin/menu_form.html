{{define "admin-content"}}
<section class="container-page py-12">
  <div class="form-page">
    <div class="page-header">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight">Menu</h1>
        <p class="mt-2 text-gray-600">Show or hide top-level items in the public site's navigation. Hiding an item only removes it from the menu — its page still works if opened directly.</p>
      </div>
    </div>

    <form method="post" action="/admin/menu" data-dirty-guard class="mt-6 space-y-6">
      <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">

      <section class="form-section">
        <h2 class="form-section-title">Visible menu items</h2>
        <div class="form-section-body">
          <label class="flex items-center gap-3">
            <input type="checkbox" name="show_news" {{if .ShowNews}}checked{{end}} class="h-4 w-4 rounded border-gray-300 text-brand focus:ring-brand">
            <span class="form-label mb-0">News</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" name="show_podcast" {{if .ShowPodcast}}checked{{end}} class="h-4 w-4 rounded border-gray-300 text-brand focus:ring-brand">
            <span class="form-label mb-0">Podcast</span>
          </label>
          <label class="flex items-center gap-3">
            <input type="checkbox" name="show_event" {{if .ShowEvent}}checked{{end}} class="h-4 w-4 rounded border-gray-300 text-brand focus:ring-brand">
            <span class="form-label mb-0">Event</span>
          </label>
        </div>
      </section>

      <div class="form-actionbar">
        <button type="submit" class="btn-brand">
          <span class="h-4 w-4">{{template "icon-save"}}</span>
          Save
        </button>
      </div>
    </form>
  </div>
</section>
{{end}}
