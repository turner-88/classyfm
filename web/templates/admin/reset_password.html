{{define "admin-content"}}
<section class="container-page flex min-h-[70vh] items-center justify-center py-12">
  <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold tracking-tight">Atur Ulang Kata Sandi</h1>
    <p class="mt-1 text-sm text-gray-500">{{.Base.StationName}}</p>

    {{if .Error}}
    <div class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
    {{end}}

    {{if .Token}}
    <form method="post" action="/admin/reset-password" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">
      <input type="hidden" name="token" value="{{.Token}}">
      <div>
        <label for="new_password" class="block text-sm font-medium text-gray-700">Kata Sandi Baru</label>
        <input id="new_password" name="new_password" type="password" required minlength="8" autofocus
               class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
      </div>
      <div>
        <label for="confirm_password" class="block text-sm font-medium text-gray-700">Konfirmasi Kata Sandi</label>
        <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
               class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
      </div>
      <button type="submit" class="btn-brand w-full justify-center">
        <span class="h-4 w-4">{{template "icon-lock"}}</span>
        Simpan Kata Sandi Baru
      </button>
    </form>
    {{else}}
    <p class="mt-4 text-sm text-gray-600">Tautan tidak valid.</p>
    {{end}}

    <a href="/admin/login" class="mt-6 inline-flex items-center gap-2 text-sm font-medium text-gray-500 hover:underline">
      <span class="h-4 w-4">{{template "icon-arrow-left"}}</span>
      Kembali ke halaman masuk
    </a>
  </div>
</section>
{{end}}
