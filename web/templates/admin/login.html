{{define "admin-content"}}
<section class="container-page flex min-h-[70vh] items-center justify-center py-12">
  <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
    <img src="/static/img/logo.png" alt="{{.Base.StationName}}" class="mx-auto h-12 w-auto">
    <h1 class="mt-6 text-center text-2xl font-bold tracking-tight">Admin Sign In</h1>

    {{template "admin-error" .Error}}
    {{if .Reset}}
    <div role="status" class="alert alert-success mt-4">
      <span class="icon-box h-4 w-4">{{template "icon-check"}}</span>
      <span>Password reset successfully. Please sign in with your new password.</span>
    </div>
    {{end}}

    <form method="post" action="/admin/login" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">
      <div>
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" type="email" required autofocus value="{{.Email}}"
               class="mt-1 form-input">
      </div>
      <div>
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" required
               class="mt-1 form-input">
      </div>
      <button type="submit" class="btn-brand w-full justify-center">
        <span class="h-4 w-4">{{template "icon-log-in"}}</span>
        Sign In
      </button>
    </form>
    <a href="/admin/forgot-password" class="mt-4 inline-block text-sm text-gray-500 hover:underline">Forgot password?</a>
  </div>
</section>
{{end}}
