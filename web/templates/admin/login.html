{{define "admin-content"}}
<section class="container-page flex min-h-[70vh] items-center justify-center py-12">
  <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold tracking-tight">Masuk Admin</h1>
    <p class="mt-1 text-sm text-gray-500">{{.Base.StationName}}</p>

    {{if .Error}}
    <div class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
    {{end}}
    {{if .Reset}}
    <div class="mt-4 rounded-lg bg-green-50 px-4 py-3 text-sm text-green-700">Kata sandi berhasil diatur ulang. Silakan masuk dengan kata sandi baru Anda.</div>
    {{end}}

    <form method="post" action="/admin/login" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input id="email" name="email" type="email" required autofocus value="{{.Email}}"
               class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Kata Sandi</label>
        <input id="password" name="password" type="password" required
               class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
      </div>
      <button type="submit" class="btn-brand w-full justify-center">
        <span class="h-4 w-4">{{template "icon-log-in"}}</span>
        Masuk
      </button>
    </form>
    <a href="/admin/forgot-password" class="mt-4 inline-block text-sm text-gray-500 hover:underline">Lupa kata sandi?</a>
  </div>
</section>
{{end}}
