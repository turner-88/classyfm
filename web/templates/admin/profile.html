{{define "admin-content"}}
<section class="container-page py-12">
  <h1 class="text-3xl font-extrabold tracking-tight">Profil</h1>

  {{if .Success}}
  <div class="mt-4 rounded-lg bg-green-50 px-4 py-3 text-sm text-green-700">{{.Success}}</div>
  {{end}}

  <div class="mt-6 max-w-2xl space-y-8">
    <div class="rounded-xl border border-gray-200 bg-white p-6">
      <h2 class="text-lg font-bold">Detail Akun</h2>
      {{if .Error}}
      <div class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
      {{end}}
      <form method="post" action="/admin/profile" class="mt-4 space-y-4">
        <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Nama</label>
          <input id="name" name="name" required value="{{.User.Name}}"
                 class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input id="email" name="email" type="email" required value="{{.User.Email}}"
                 class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Peran</label>
          <p class="mt-1 text-sm text-gray-500 capitalize">{{.User.Role}}</p>
        </div>
        <button type="submit" class="btn-brand">
          <span class="h-4 w-4">{{template "icon-save"}}</span>
          Simpan
        </button>
      </form>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white p-6">
      <h2 class="text-lg font-bold">Ubah Kata Sandi</h2>
      {{if .PassError}}
      <div class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{.PassError}}</div>
      {{end}}
      <form method="post" action="/admin/profile/password" class="mt-4 space-y-4">
        <input type="hidden" name="csrf_token" value="{{.Base.CSRFToken}}">
        <div>
          <label for="new_password" class="block text-sm font-medium text-gray-700">Kata Sandi Baru</label>
          <input id="new_password" name="new_password" type="password" required minlength="8"
                 class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
        </div>
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-700">Konfirmasi Kata Sandi Baru</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
                 class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand">
        </div>
        <button type="submit" class="btn-brand">
          <span class="h-4 w-4">{{template "icon-lock"}}</span>
          Ubah Kata Sandi
        </button>
      </form>
    </div>
  </div>
</section>
{{end}}
