{{define "content"}}
<!-- Same navy arc band as Home/Broadcasters/About. -->
<section class="on-navy relative overflow-hidden bg-brand text-white">
  <div class="arc-field pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="container-page relative py-14 sm:py-16">
    <p class="eyebrow-invert">Talk to us</p>
    <h1 class="page-title mt-2 !text-white">Connect</h1>
    <p class="mt-4 max-w-2xl text-base leading-relaxed text-white/70 sm:text-lg">
      A public chatroom for {{.Base.StationName}} listeners — the same live chat as the
      mobile app. Sign in with Google to view and join the conversation.
    </p>
  </div>
</section>

<section class="container-page section">
  <!-- Same .js-connect-* hooks as the floating widget, so connect.js drives both. This
       feed is a taller shell hydrated from the shared Firebase Realtime Database. -->
  <div class="js-connect-root flex max-w-2xl flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-card">
    <div class="flex items-center gap-2 border-b border-gray-200 px-5 py-4">
      <span class="live-dot"></span>
      <p class="font-heading text-base font-bold text-gray-900">Live Chat</p>
    </div>

    <ul class="js-connect-feed flex h-[60vh] flex-col gap-4 overflow-y-auto px-5 py-5">
      <li class="js-connect-empty m-auto text-center text-sm text-gray-400">Loading messages…</li>
    </ul>

    <div class="js-connect-composer border-t border-gray-200 p-4">
      {{template "connect-composer"}}
    </div>
  </div>
</section>
{{end}}
