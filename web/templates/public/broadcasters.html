{{define "content"}}
<section class="container-page py-12">
  <h1 class="text-3xl font-extrabold tracking-tight">Broadcasters</h1>
  <p class="mt-2 text-gray-600">Kenali penyiar dan reporter {{.Base.StationName}}.</p>

  <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {{range .Broadcasters}}
    <a href="/broadcasters/{{.Slug}}" class="block overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
      <div class="relative flex h-56 w-full items-center justify-center overflow-hidden bg-gradient-to-br from-brand to-brand-dark text-white/60">
        {{template "icon-broadcaster-placeholder"}}
        {{if .PhotoUrl.Valid}}
        <img src="{{.PhotoUrl.String}}" alt="" class="js-img-fade absolute inset-0 h-full w-full object-cover opacity-0 transition-opacity duration-300">
        {{end}}
      </div>
      <div class="p-5">
        <h2 class="text-lg font-bold">{{.Name}}</h2>
        {{if .Role.Valid}}<p class="mt-1 text-sm text-gray-500">{{.Role.String}}</p>{{end}}
      </div>
    </a>
    {{else}}
    <div class="col-span-full rounded-xl border border-dashed border-gray-300 p-10 text-center text-gray-400">
      Belum ada broadcaster.
    </div>
    {{end}}
  </div>
</section>
{{end}}
